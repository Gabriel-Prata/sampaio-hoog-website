{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8 bg-cover bg-center relative" style="background-image: url('{% static 'home/capa-v3.jpeg' %}')">
    <div class="absolute inset-0 bg-azul-petroleo/70 backdrop-blur-sm"></div>
    
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-2xl relative z-10 transition-all duration-500 ease-in-out transform hover:-translate-y-1">
        <div>
            <div class="flex justify-center">
                <img class="h-16 w-auto" src="{% static 'logo/sehlogo2.png' %}" alt="Sampaio & Hoog">
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-azul-petroleo font-serif">
                Acesso Restrito
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Painel Administrativo de Conteúdo
            </p>
        </div>
        
        <form class="mt-8 space-y-6" action="" method="POST">
            {% csrf_token %}
            {% if form.errors %}
                <div class="bg-red-50 text-red-700 p-3 rounded text-sm text-center font-medium shadow-sm">
                    Usuário ou senha inválidos.
                </div>
            {% endif %}
            
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="id_username" class="sr-only">Usuário</label>
                    <input id="id_username" name="username" type="text" required class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-azul-petroleo focus:border-azul-petroleo focus:z-10 sm:text-sm" placeholder="Usuário">
                </div>
                <div>
                    <label for="id_password" class="sr-only">Senha</label>
                    <input id="id_password" name="password" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-azul-petroleo focus:border-azul-petroleo focus:z-10 sm:text-sm" placeholder="Senha">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-azul-petroleo hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-azul-petroleo transition-all duration-300 shadow-md hover:shadow-lg">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-lock text-white/50 group-hover:text-white/80"></i>
                    </span>
                    Entrar no Painel
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
