{% load static %}
<header
  x-data="{ open: false }"
  class="bg-azul-petroleo lg:bg-azul-petroleo/80 backdrop-blur-sm text-cinza-geada shadow-lg sticky top-0 z-50 
         px-4 py-6 lg:p-4"
>
  <nav class="container mx-auto flex justify-between items-center">
    
<a href="/#inicio" class="text-2xl font-bold font-serif flex-shrink-0"
        ><img class="h-24 lg:h-20 transition-all duration-300 ease-in-out" src="{% static "logo/sehlogo2.png" %}" alt="S'ampaio & Hoog Logo"></a
      >

    <div class="hidden lg:flex items-center space-x-12">
      <div class="space-x-8 text-xl flex items-center">
        <a href="/#inicio" class="hover:text-black transition-colors">Sampaio & Hoog</a>
        <a href="/#servicos" class="hover:text-black transition-colors">Atuação</a>
        <a href="/#sobre" class="hover:text-black transition-colors">Sobre Nós</a>
        <a href="/#contato" class="hover:text-black transition-colors">Contato</a>
        {% if request.user.is_authenticated %}
        <a href="{% url 'core:painel_list' %}" class="hover:text-black transition-colors font-bold text-yellow-500 flex items-center gap-2">
            <i class="fas fa-columns"></i> Painel
        </a>
        {% endif %}
      </div>
      <div class="flex space-x-5">
        <a href="https://www.instagram.com/sampaiohoogadv/" target="_blank" aria-label="Instagram" class="text-white-500 hover:text-black transition-colors">
          <i class="fab fa-instagram text-3xl"></i>
        </a>
        <a href="https://www.facebook.com/sampaiohoogadv/" target="_blank" aria-label="Facebook" class="text-white-500 hover:text-black transition-colors">
          <i class="fab fa-facebook-f text-2xl"></i>
        </a>
      </div>
    </div>

    <div class="lg:hidden">
      <button @click="open = !open" aria-label="Abrir Menu">
        <svg x-show="open" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        <svg x-show="!open" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
      </button>
    </div>

  </nav>

  <div 
    x-show="open" 
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 transform -translate-y-4"
    x-transition:enter-end="opacity-100 transform translate-y-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 transform translate-y-0"
    x-transition:leave-end="opacity-0 transform -translate-y-4"
    @click.away="open = false"
    class="lg:hidden absolute left-0 w-full bg-azul-petroleo shadow-lg z-40"
    style="display: none;" 
  >
    <div class="container mx-auto px-4 py-6 flex flex-col space-y-5">
      <a href="/#inicio" @click="open = false" class="text-xl hover:text-black">Sampaio & Hoog</a>
      <a href="/#servicos" @click="open = false" class="text-xl hover:text-black">Atuação</a>
      <a href="/#sobre" @click="open = false" class="text-xl hover:text-black">Sobre Nós</a>
      <a href="/#contato" @click="open = false" class="text-xl hover:text-black">Contato</a>
      
      {% if request.user.is_authenticated %}
        <a href="{% url 'core:painel_list' %}" @click="open = false" class="text-xl hover:text-black font-bold text-yellow-500 flex items-center gap-2">
            <i class="fas fa-columns"></i> Painel
        </a>
      {% endif %}

      <div class="flex space-x-6 pt-4 border-t border-cinza-geada/20">
        <a href="https://www.instagram.com/sampaiohoogadv/" target="_blank" class="hover:text-black">
          <i class="fab fa-instagram text-3xl"></i>
        </a>
        <a href="https://www.facebook.com/sampaiohoogadv/" target="_blank" class="hover:text-black">
          <i class="fab fa-facebook-f text-2xl"></i>
        </a>
      </div>
    </div>
  </div>

</header>
